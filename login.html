<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | English Notes</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#faf7ff;
    --card:#ffffff;
    --primary:#7e22ce;
    --deep:#581c87;
    --lav:#a855f7;
    --soft:#e9d5ff;
    --text:#261b32;
    --muted:#6b5e72;
    --border:#e9ddf2;
    --danger:#dc2626;
    --shadow:0 18px 45px rgba(88,28,135,.12);
}

body{
    min-height:100vh;
    font-family:Inter,Arial,sans-serif;

    background:
        radial-gradient(
            circle at top left,
            #f3e8ff 0%,
            transparent 35%
        ),
        radial-gradient(
            circle at bottom right,
            #ede9fe 0%,
            transparent 35%
        ),
        var(--bg);

    color:var(--text);

    display:flex;
    align-items:center;
    justify-content:center;

    padding:25px 15px;
}

/* =========================
   CARD
========================= */

.card{
    width:100%;
    max-width:430px;

    background:var(--card);

    border:1px solid var(--border);

    border-radius:26px;

    padding:34px;

    box-shadow:var(--shadow);

    animation:fadeUp .45s ease;
}

@keyframes fadeUp{

    from{
        opacity:0;
        transform:translateY(15px);
    }

    to{
        opacity:1;
        transform:none;
    }

}

/* =========================
   LOGO
========================= */

.logo{
    width:72px;
    height:72px;

    margin:0 auto 17px;

    border-radius:21px;

    background:
        linear-gradient(
            135deg,
            #7e22ce,
            #a855f7
        );

    color:white;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:34px;

    box-shadow:
        0 10px 25px
        rgba(126,34,206,.22);
}

/* =========================
   HEADER
========================= */

h1{
    text-align:center;

    font-family:
        "Playfair Display",
        Georgia,
        serif;

    color:var(--deep);

    font-size:32px;

    line-height:1.2;

    margin-bottom:9px;
}

.subtitle{
    text-align:center;

    color:var(--muted);

    margin-bottom:27px;

    font-size:14px;

    line-height:1.6;
}

/* =========================
   FORM
========================= */

label{
    display:block;

    margin:15px 0 7px;

    font-size:14px;

    font-weight:700;

    color:var(--text);
}

input{
    width:100%;

    padding:13px 14px;

    border:1px solid var(--border);

    background:#fff;

    color:var(--text);

    border-radius:12px;

    font-family:inherit;

    font-size:15px;

    outline:none;

    transition:.2s;
}

input::placeholder{
    color:#a89db0;
}

input:focus{

    border-color:var(--lav);

    box-shadow:
        0 0 0 4px
        rgba(168,85,247,.12);
}

/* =========================
   BUTTON
========================= */

button{
    width:100%;

    margin-top:23px;

    padding:13px 16px;

    border:0;

    border-radius:12px;

    background:
        linear-gradient(
            135deg,
            #7e22ce,
            #a855f7
        );

    color:white;

    font-family:inherit;

    font-size:15px;

    font-weight:800;

    cursor:pointer;

    transition:.2s;

    box-shadow:
        0 8px 20px
        rgba(126,34,206,.20);
}

button:hover:not(:disabled){

    transform:translateY(-2px);

    box-shadow:
        0 11px 26px
        rgba(126,34,206,.28);
}

button:active:not(:disabled){

    transform:scale(.98);
}

button:disabled{

    opacity:.55;

    cursor:not-allowed;
}

/* =========================
   MESSAGE
========================= */

.message{

    margin-top:16px;

    padding:13px 15px;

    border-radius:13px;

    display:none;

    font-size:14px;

    line-height:1.5;
}

.message.error{

    display:block;

    background:#fee2e2;

    color:#991b1b;

    border:1px solid #fecaca;
}

.message.success{

    display:block;

    background:#dcfce7;

    color:#166534;

    border:1px solid #bbf7d0;
}

/* =========================
   LINKS
========================= */

.links{

    text-align:center;

    margin-top:22px;

    font-size:14px;

    color:var(--muted);

    line-height:1.8;
}

.links a{

    color:var(--primary);

    font-weight:800;

    text-decoration:none;
}

.links a:hover{

    text-decoration:underline;
}

/* =========================
   SMALL INFO
========================= */

.info{

    margin-top:20px;

    padding:13px 15px;

    border-radius:14px;

    background:
        color-mix(
            in srgb,
            var(--soft) 45%,
            var(--card)
        );

    border:1px solid var(--border);

    color:var(--muted);

    font-size:12px;

    text-align:center;

    line-height:1.5;
}

/* =========================
   MOBILE
========================= */

@media(max-width:480px){

    body{
        padding:18px 12px;
    }

    .card{

        padding:26px 20px;

        border-radius:22px;
    }

    .logo{

        width:64px;
        height:64px;

        font-size:30px;
    }

    h1{

        font-size:28px;
    }

}

</style>
</head>


<body>

<div class="card">

    <!-- =========================
         LOGIN
    ========================== -->

    <div class="logo">
        📚
    </div>


    <h1>
        Welcome Back
    </h1>


    <p class="subtitle">
        Login to continue to your English Notes study hub.
    </p>


    <form id="loginForm">

        <label for="email">
            Email Address
        </label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email address"
            autocomplete="email"
            required
        >


        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
        >


        <button
            type="submit"
            id="loginBtn"
        >
            Login
        </button>

    </form>


    <div
        id="message"
        class="message"
    ></div>


    <div class="links">

        Don't have an account?

        <a href="register.html">
            Create Account
        </a>

    </div>


    <div class="info">

        🔐 Your notes are available only after
        your payment has been approved.

    </div>

</div>


<script type="module">

import {
    auth,
    db
} from "./firebase-config.js";


import {
    signInWithEmailAndPassword,
    signOut
} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";


import {
    ref,
    get
} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-database.js";


/* =========================
   ELEMENTS
========================= */

const form =
    document.getElementById("loginForm");

const message =
    document.getElementById("message");

const loginBtn =
    document.getElementById("loginBtn");


/* =========================
   MESSAGE
========================= */

function showMessage(
    text,
    type
){

    message.textContent =
        text;

    message.className =
        "message " + type;

    message.style.display =
        "block";

}


/* =========================
   LOGIN
========================= */

form.addEventListener(
    "submit",
    async (e) => {

        e.preventDefault();


        const email =
            document
                .getElementById("email")
                .value
                .trim();

        const password =
            document
                .getElementById("password")
                .value;


        loginBtn.disabled =
            true;

        loginBtn.textContent =
            "Logging in...";


        message.style.display =
            "none";


        try{

            /* =========================
               FIREBASE AUTHENTICATION
            ========================== */

            const credential =
                await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


            const user =
                credential.user;


            /* =========================
               GET USER PROFILE
            ========================== */

            const snapshot =
                await get(
                    ref(
                        db,
                        "users/" +
                        user.uid
                    )
                );


            /* =========================
               PROFILE NOT FOUND
            ========================== */

            if(!snapshot.exists()){

                await signOut(auth);

                showMessage(
                    "Your account information was not found. Please contact the administrator.",
                    "error"
                );

                loginBtn.disabled =
                    false;

                loginBtn.textContent =
                    "Login";

                return;
            }


            const userData =
                snapshot.val();


            /* =========================
               ADMIN
            ========================== */

            if(
                userData.role ===
                "admin"
            ){

                window.location.replace(
                    "admin.html"
                );

                return;
            }


            /* =========================
               APPROVED STUDENT
            ========================== */

            if(
                userData.paymentStatus ===
                "approved"
            ){

                window.location.replace(
                    "index.html"
                );

                return;
            }


            /* =========================
               REJECTED PAYMENT
            ========================== */

            if(
                userData.paymentStatus ===
                "rejected"
            ){

                window.location.replace(
                    "register.html"
                );

                return;
            }


            /* =========================
               PENDING
            ========================== */

            window.location.replace(
                "pending.html"
            );

        }

        catch(error){

            console.error(
                "Login error:",
                error
            );


            let errorMessage =
                "Unable to login. Please try again.";


            if(
                error.code ===
                "auth/invalid-credential"
            ){

                errorMessage =
                    "Incorrect email or password.";

            }

            else if(
                error.code ===
                "auth/user-not-found"
            ){

                errorMessage =
                    "No account exists with this email.";

            }

            else if(
                error.code ===
                "auth/wrong-password"
            ){

                errorMessage =
                    "Incorrect password.";

            }

            else if(
                error.code ===
                "auth/invalid-email"
            ){

                errorMessage =
                    "Please enter a valid email address.";

            }

            else if(
                error.code ===
                "auth/too-many-requests"
            ){

                errorMessage =
                    "Too many login attempts. Please wait a while and try again.";

            }

            else if(
                error.code ===
                "auth/network-request-failed"
            ){

                errorMessage =
                    "Network error. Please check your internet connection.";

            }


            showMessage(
                errorMessage,
                "error"
            );


            loginBtn.disabled =
                false;

            loginBtn.textContent =
                "Login";

        }

    }
);

</script>

</body>
</html>
